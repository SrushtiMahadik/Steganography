<html>
    <head>
        <title>Firebase_form</title>
        <link rel="stylesheet" href="styleL.css">
    </head>
    <body>
        <nav class="nav">
            <div class="nav-logo">
                <p>STEGANOIT</p>
            </div>
            
        <div class="box">
        
            <div class="form">
                <h2>Login</h2>
                <form>
                    <div class="inputbox">
                        <input type="text" class="input-field" placeholder="Username" id="username" required>
                        
                        
                    </div>
                    <div class="inputbox">
                        <input type="email" value="" placeholder="Email" id="email" required>
                       
                    </div>
                    <div class="inputbox">
                        <input type="password" value="" placeholder="Password" >
                    </div>
                    <div class=" card" onclick="window.open('b1.html','_blank')">
                    <input type="submit" value="Login" class="sub" id="submit">
                </form>
                </div>
            </div>
        </div>
        <script type="module">
            // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
            import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";
          
          
            // Your web app's Firebase configuration
            const firebaseConfig = {
              apiKey: "AIzaSyDJ02TfVxjBLgxp9mazA3E76qTObaFrKBQ",
              authDomain: "steganography-13831.firebaseapp.com",
              projectId: "steganography-13831",
              storageBucket: "steganography-13831.appspot.com",
              messagingSenderId: "924748449147",
              appId: "1:924748449147:web:cacd15de7e5a0a4817a9de"
            };
          
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
          
            const db = getDatabase(app);
          
            document.getElementById("submit").addEventListener('click', function(e){
                e.preventDefault();

              set(ref(db, 'user/' + document.getElementById("username").value),
              {
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
              });
              alert("Login Successfull !");
          
            })
          </script>
    </body>
</html>
